services:
  - type: web
    name: budgetflow-backend
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn budgetflow_backend.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: budgetflow-db
          property: connectionString

databases:
  - name: budgetflow-db
    databaseName: budgetflow
    user: budgetflow_user
    plan: free
